    comfyui_folder: unet
    family: FLUX
    variant: dev
    display_name: FLUX.1 [dev]
    architecture: flow_matching
    total_params_b: 12.0
    default_steps: 25
    vram_gb: { fp16: 24.0, q8: 13.0, q4: 7.0 }
    time_per_step_seconds: { m3_max: 1.8, m4_max: 1.4 }
    license: FLUX.1-dev (non-commercial)
    supports: [image_generation]
    harnesses_compatible: [drawthings, comfyui, invokeai, forge, diffusers]
    scores:
      geneval:           { value: 0.67, source: "Black Forest Labs blog (Aug 2024)", confidence: measured }
      imagen_arena_elo:  { value: 1093, source: "imagen-leaderboard.dev (May 2025)", confidence: measured }
    notes: "Reference flow-matching model. The 12B param count makes it a stretch on <24 GB Macs without Q8/Q4."

