# Curated diffusion / flow-matching catalog.
#
# Why curated and not scraped: imagen-leaderboard.dev is the only ELO board
# that meaningfully covers open-weights image gen, and it's both incomplete
# and slow-moving. There is no equivalent of HF's Open LLM Leaderboard for
# image. So we hand-write the top ~20 models with numbers from:
#   - Black Forest Labs / Stability / NVIDIA model cards and blog posts
#   - The GenEval paper (Ghosh et al., 2023) and its leaderboard
#   - imagen-leaderboard.dev (snapshot date noted per row)
#   - HiDream / OmniGen / AuraFlow technical reports
#
# Numbers were collected May 2026; sources are cited per model so they're
# auditable. Refreshing this file is a manual quarterly task until a
# fetcher is built.
#
# Schema (per model):
#   canonical_id        — slug
#   family              — taxonomy: FLUX / SD3.5 / SDXL / SD1.5 / Cascade / AuraFlow / HiDream / OmniGen / Sana / Lumina / PixArt / Kolors
#   variant             — dev / schnell / large / medium / turbo / ...
#   display_name        — UI string
#   architecture        — diffusion | flow_matching | rectified_flow
#   total_params_b      — total parameter count (B)
#   default_steps       — sampling steps for the published quality target
#   vram_gb             — { fp16, q8, q4 } resident VRAM at 1024² inference
#   time_per_step_seconds — { m3_max, m4_max } empirical time per step at 1024²
#                           (we scale to other chips by relative GPU TFLOPS)
#   license             — short string
#   supports            — list of: image_generation, image_editing
#   harnesses_compatible — ids from image_harnesses.yaml
#   scores              — { benchmark: { value, source, confidence } }
#   install             — per-harness install hint, optional
#   notes               — short context

image_models:

