# Harnesses (apps / runtimes) that consume diffusion checkpoints. Mirrors
# backend/data/harnesses.yaml in shape. The big difference vs. text LLMs is
# format: image gen is mostly safetensors + a per-app folder convention,
# not GGUF + a model registry. So `requires.format` and `requires.platform`
# carry more weight than they do for text harnesses.
#
# Only the most-used local harnesses are included. We can extend later.

image_harnesses:
  - id: drawthings
    name: Draw Things
    category: native-mac
    description: Mac/iOS native diffusion app. Curated model catalog with one-tap download. Best-in-class for first-time users on Apple Silicon.
    homepage: https://drawthings.ai
    requires:
      platform: macos
      format: [safetensors, drawthings_native]
    prefers:
      family_bonus:
        SDXL: 0.5
        SD3.5: 0.3
        FLUX: 0.5
    install_command_template: "Open Draw Things → Settings → Manage Models → search '{display_name}' (catalog includes ~50 curated models)"

  - id: mochi-diffusion
    name: Mochi Diffusion
    category: native-mac
    description: Mac-native, CoreML-only. Uses the Apple Neural Engine for SD/SDXL inference. Doesn't yet support FLUX or SD3.
    homepage: https://github.com/godly-devotion/MochiDiffusion
    requires:
      platform: macos
      format: [coreml]
      family_in: [SD1.5, SDXL]
    prefers:
      family_bonus:
        SDXL: 0.5
        SD1.5: 0.3
    install_command_template: "python -m python_coreml_stable_diffusion.torch2coreml --model-version {hf_id} --bundle-resources-for-swift-cli -o ~/Documents/MochiDiffusion/models/{slug}/"

  - id: comfyui
    name: ComfyUI
    category: node-based
    description: Node-based diffusion workflow editor. Supports everything — SD, SDXL, SD3, FLUX, Cascade, Lumina, AuraFlow. Steepest learning curve, highest ceiling.
    homepage: https://github.com/comfyanonymous/ComfyUI
    requires:
      format: [safetensors, gguf_diffusion]
    prefers:
      family_bonus: {}
    install_command_template: "huggingface-cli download {hf_id} --local-dir ComfyUI/models/{comfyui_folder}/{slug}/"

  - id: invokeai
    name: InvokeAI
    category: graphical
    description: Open-source professional creative tool. SD, SDXL, FLUX support with a polished canvas UI and asset management.
    homepage: https://github.com/invoke-ai/InvokeAI
    requires:
      format: [safetensors]
      family_in: [SD1.5, SDXL, SD3.5, FLUX]
    install_command_template: "InvokeAI → Model Manager → Add via URL → https://huggingface.co/{hf_id}"

  - id: forge
    name: Stable Diffusion WebUI Forge
    category: graphical
    description: AUTOMATIC1111 fork tuned for VRAM-constrained machines. Strong FLUX + SDXL support, large extension ecosystem.
    homepage: https://github.com/lllyasviel/stable-diffusion-webui-forge
    requires:
      format: [safetensors]
    install_command_template: "huggingface-cli download {hf_id} --include '*.safetensors' --local-dir stable-diffusion-webui-forge/models/Stable-diffusion/"

  - id: diffusers
    name: Diffusers (Python)
    category: library
    description: Hugging Face's diffusion library. For people who want to script generation, fine-tune, or embed image gen in their own apps.
    homepage: https://huggingface.co/docs/diffusers
    requires:
      format: [safetensors, diffusers]
    install_command_template: "from diffusers import DiffusionPipeline; DiffusionPipeline.from_pretrained('{hf_id}')"
